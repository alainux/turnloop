[project]
name = "turn"
version = "0.1.0"
description = "Turn — a live, editable workgraph that turns a vague prompt into visible next steps and starts executing them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
# LLM-backed planner via the OpenAI SDK (optional; Codex is used by default).
llm = ["openai>=1.0"]
# Optional Prefect 3 execution backend behind the thin adapter.
prefect = ["prefect>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.50",
    "pillow>=10.0",
]

[project.scripts]
turn = "turn.__main__:main"

[tool.setuptools.packages.find]
include = ["turn*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["turn/tests"]
