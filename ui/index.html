<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turn — live workgraph</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">Turn <span class="host">turnloop.tech</span></div>
  </header>

  <div id="project-bar">
    <button id="new-btn" type="button">+ New</button>
    <label>Project:</label>
    <select id="project-select"><option value="">— none —</option></select>
    <span id="repo-line" class="muted"></span>
    <span id="status-line"></span>
    <button id="clear-btn" type="button" title="Remove all projects">Clear</button>
  </div>

  <div id="new-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>New project</h3>
      <label class="field-label" for="new-prompt">Objective</label>
      <textarea id="new-prompt" rows="3" placeholder="Describe an objective… (vague is fine)"></textarea>

      <label class="field-label" for="new-mode-create">Location</label>
      <div class="mode-row">
        <label class="radio"><input type="radio" id="new-mode-create" name="new-mode" value="create" checked /> New repo (or empty folder)</label>
        <label class="radio"><input type="radio" name="new-mode" value="open" /> Open existing repo</label>
      </div>
      <input id="new-dir" aria-label="Working directory" placeholder="working directory — blank = ./projects/&lt;id&gt;" />
      <span class="muted">New makes a fresh git repo that becomes the project root. Open refactors an existing repo on a side branch.</span>

      <div class="modal-actions">
        <button id="new-cancel" class="secondary" type="button">Cancel</button>
        <button id="new-create" class="run" type="button">Create</button>
      </div>
    </div>
  </div>

  <main>
    <section id="graph-pane">
      <div class="pane-title">
        WorkGraph
        <span class="pane-controls">
          <label class="switch"><input type="checkbox" id="auto-run" checked /> Auto-run</label>
          <label class="switch"><input type="checkbox" id="auto-accept" /> Auto-accept merges</label>
          <button id="step-btn" type="button" hidden>Step ▶</button>
        </span>
      </div>
      <div class="graph-legend">solid = contains · <span style="color:#d29922">dashed = depends on</span></div>
      <div id="graph"></div>
    </section>
    <section id="detail-pane">
      <div class="pane-title">Node</div>
      <div id="detail"><p class="muted">Select a node to inspect, edit, or act on it.</p></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
